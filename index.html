<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Children's Story</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e1bee7);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px #bdbdbd;
        }

        h1 {
            color: #8e24aa;
        }

        p {
            color: #555;
            line-height: 1.8;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #8e24aa;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #6a1b9a;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #f3e5f5;
            border-radius: 12px;
            text-align: left;
        }

        .illustration {
            font-size: 65px;
            text-align: center;
            margin: 15px;
        }

        #story {
            line-height: 1.9;
            color: #333;
        }

        footer {
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌈 AI Children's Story</h1>

        <p>
            Welcome to a magical world!
            Create a fun story with your favourite theme.
        </p>

        <input
            type="text"
            id="childName"
            placeholder="Enter your name"
        >

        <br>

        <select id="theme">
            <option value="forest">🌳 Magical Forest</option>
            <option value="space">🚀 Space Adventure</option>
            <option value="animals">🐰 Friendly Animals</option>
            <option value="princess">👑 Princess Adventure</option>
        </select>

        <br>

        <button onclick="generateStory()">
            ✨ Generate My Story
        </button>

        <div id="result">

            <h2 id="storyTitle"></h2>

            <div class="illustration" id="picture"></div>

            <p id="story"></p>

            <h3>🌟 The End!</h3>

            <button onclick="window.print()">
                📄 Print Story
            </button>

        </div>

        <footer>
            Made with ❤️ for little storytellers
        </footer>

    </div>

    <script>
        function generateStory() {

            let name = document
                .getElementById("childName")
                .value.trim();

            let theme = document
                .getElementById("theme")
                .value;

            if (name === "") {
                name = "Little Star";
            }

            let title = "";
            let picture = "";
            let story = "";

            if (theme === "forest") {

                title = "The Magical Forest";
                picture = "🌳 🦋 🧚";

                story =
                    name + " entered a beautiful magical forest. " +
                    "There, " + name +
                    " met a tiny fairy and a friendly rabbit. " +
                    "The fairy showed a garden filled with glowing flowers. " +
                    "Suddenly, a little bird needed help finding its nest. " +
                    name + " and the rabbit worked together to help the bird. " +
                    "All the forest animals celebrated their kindness. " +
                    name + " learned that helping others makes the world magical.";

            } else if (theme === "space") {

                title = "The Space Adventure";
                picture = "🚀 🌙 👽";

                story =
                    name + " travelled into space in a colourful rocket. " +
                    "On a distant planet, " + name +
                    " met a friendly alien. " +
                    "The alien had lost its way home. " +
                    "Together, they followed the stars and found the alien's family. " +
                    "Everyone celebrated their new friendship. " +
                    name + " returned to Earth with wonderful memories.";

            } else if (theme === "animals") {

                title = "The Friendly Animals";
                picture = "🐰 🦁 🐦";

                story =
                    name + " met a rabbit, a little lion and a clever monkey. " +
                    "One sunny day, they found a baby bird that needed help. " +
                    "The friends worked together to help the bird return to its nest. " +
                    "The mother bird thanked them with a happy song. " +
                    name + " discovered that teamwork makes difficult things easier.";

            } else {

                title = "The Princess and the Lost Star";
                picture = "👑 🏰 ⭐";

                story =
                    name + " discovered a beautiful castle beyond the clouds. " +
                    "Inside, a kind princess was searching for a missing star. " +
                    name + " followed a rainbow and found the star near a lake. " +
                    "Together, they returned it to the night sky. " +
                    "The whole kingdom shone with beautiful light. " +
                    name + " learned that courage and kindness create magic.";
            }

            document.getElementById("storyTitle")
                .textContent = title;

            document.getElementById("picture")
                .textContent = picture;

            document.getElementById("story")
                .textContent = story;

            document.getElementById("result")
                .style.display = "block";
        }
    </script>

</body>
</html>
